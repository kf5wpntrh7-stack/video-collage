<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#151a22" />
  <title>銅鑼燒工作室｜手機影片拼接 2 格測試版</title>
  <style>
    :root{--bg:#10141b;--panel:#191f29;--panel2:#202836;--line:#344054;--text:#eef3fa;--muted:#9aa8ba;--accent:#6e88a8;--accent2:#8ba3bf;--danger:#c66e78}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:linear-gradient(180deg,#0e1218,#141a23);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;min-height:100vh}
    .app{width:min(100%,560px);margin:auto;padding:18px 14px 40px}
    h1{font-size:20px;margin:2px 0 4px;text-align:center;letter-spacing:.5px}
    .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px}
    .notice{background:#151c26;border:1px solid #2a3545;border-radius:12px;padding:10px 12px;color:#b7c4d4;font-size:12px;line-height:1.6;margin-bottom:12px}
    .grid{display:grid;gap:10px}
    .slot{position:relative;height:220px;border:1px dashed #526176;border-radius:15px;background:#151b24;overflow:hidden;display:flex;align-items:center;justify-content:center}
    .slot video{width:100%;height:100%;object-fit:cover;display:none;background:#000}
    .empty{display:flex;flex-direction:column;gap:7px;align-items:center;color:#aebccd;font-size:14px;padding:20px;text-align:center}
    .plus{font-size:30px;line-height:1;color:#859bb7}
    .slot input{display:none}
    .slot-tools{position:absolute;right:8px;top:8px;display:none;gap:6px}
    .slot.has-video .slot-tools{display:flex}
    .mini{border:1px solid #596a80;background:rgba(17,22,30,.86);color:#e9eef6;border-radius:9px;padding:6px 9px;font-size:12px}
    .slot-label{position:absolute;left:8px;top:8px;background:rgba(17,22,30,.82);padding:5px 8px;border-radius:8px;font-size:12px;color:#dce5f0}
    .control{margin-top:10px;background:var(--panel);border:1px solid #2b3545;border-radius:14px;padding:12px}
    .row{display:flex;align-items:center;gap:9px;margin:8px 0}
    .row label{width:82px;color:#c6d1df;font-size:13px;flex:none}
    input[type=range]{width:100%;accent-color:var(--accent2)}
    .time{width:68px;text-align:right;font-variant-numeric:tabular-nums;color:#dce5f0;font-size:13px}
    .duration{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:6px}
    .choice,.btn{border:1px solid #425168;background:var(--panel2);color:#e8eef6;border-radius:11px;padding:10px;font-size:14px;font-weight:600}
    .choice.active{background:#34445a;border-color:#7892b2}
    .actions{display:grid;grid-template-columns:1fr 1.4fr;gap:9px;margin-top:12px}
    .btn.primary{background:#526e90;border-color:#6f89a9}
    .btn:disabled{opacity:.45}
    .progress-wrap{display:none;margin-top:12px;background:var(--panel);border:1px solid #2b3545;border-radius:14px;padding:12px}
    .progress{height:10px;background:#283242;border-radius:99px;overflow:hidden;margin:8px 0}
    .bar{height:100%;width:0;background:#8098b5;transition:width .2s}
    .status{font-size:13px;color:#c5d0de;line-height:1.5;word-break:break-word}
    .result{display:none;margin-top:12px;background:var(--panel);border:1px solid #2b3545;border-radius:14px;padding:12px}
    .result video{width:100%;max-height:70vh;background:#000;border-radius:10px}
    .download{display:block;text-align:center;text-decoration:none;margin-top:10px}
    .switch{margin-left:auto;display:flex;align-items:center;gap:6px;color:#b8c4d3;font-size:12px}
    .switch input{width:18px;height:18px}
    .foot{color:#7f8da0;font-size:11px;text-align:center;margin-top:15px;line-height:1.6}
  </style>
</head>
<body>
<div class="app">
  <h1>手機影片拼接</h1>
  <div class="sub">2 格穩定測試版・上下排列・540 × 960</div>
  <div class="notice">第一次輸出會下載約 30 MB 的處理引擎。請用 Safari 開啟網站，輸出時保持畫面開啟，不要切換到其他 App。</div>

  <div class="grid">
    <div class="slot" id="slot0">
      <div class="slot-label">第 1 格</div>
      <video id="video0" playsinline muted></video>
      <label class="empty" id="empty0" for="file0"><span class="plus">＋</span><span>點此加入第 1 支影片</span></label>
      <input id="file0" type="file" accept="video/*" />
      <div class="slot-tools"><button class="mini" data-change="0">更換</button><button class="mini" data-remove="0">移除</button></div>
    </div>
    <div class="control" id="control0">
      <div class="row"><label>截取起點</label><input id="start0" type="range" min="0" max="0" step="0.1" value="0" disabled><span class="time" id="time0">00:00.0</span></div>
      <div class="row"><label>聲音</label><input id="vol0" type="range" min="0" max="1.5" step="0.05" value="1"><span class="time" id="volText0">100%</span><span class="switch"><input id="mute0" type="checkbox">靜音</span></div>
    </div>

    <div class="slot" id="slot1">
      <div class="slot-label">第 2 格</div>
      <video id="video1" playsinline muted></video>
      <label class="empty" id="empty1" for="file1"><span class="plus">＋</span><span>點此加入第 2 支影片</span></label>
      <input id="file1" type="file" accept="video/*" />
      <div class="slot-tools"><button class="mini" data-change="1">更換</button><button class="mini" data-remove="1">移除</button></div>
    </div>
    <div class="control" id="control1">
      <div class="row"><label>截取起點</label><input id="start1" type="range" min="0" max="0" step="0.1" value="0" disabled><span class="time" id="time1">00:00.0</span></div>
      <div class="row"><label>聲音</label><input id="vol1" type="range" min="0" max="1.5" step="0.05" value="1"><span class="time" id="volText1">100%</span><span class="switch"><input id="mute1" type="checkbox">靜音</span></div>
    </div>
  </div>

  <div class="control">
    <div style="font-size:13px;color:#c6d1df;margin-bottom:6px">成品長度</div>
    <div class="duration">
      <button class="choice active" data-duration="10">10 秒</button>
      <button class="choice" data-duration="15">15 秒</button>
      <button class="choice" data-duration="5">5 秒測試</button>
    </div>
    <div class="actions">
      <button class="btn" id="previewBtn">預覽片段</button>
      <button class="btn primary" id="exportBtn">產生拼接影片</button>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="status" id="status">準備中…</div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="status" id="detail"></div>
  </div>

  <div class="result" id="result">
    <div style="font-size:14px;margin-bottom:8px">輸出完成</div>
    <video id="resultVideo" controls playsinline></video>
    <a class="btn primary download" id="download" download="手機影片拼接.mp4">下載／儲存影片</a>
  </div>
  <div class="foot">影片只在你的手機內處理，不會上傳到伺服器。<br>測試版先確認兩格畫面與兩邊聲音是否正常。</div>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script>
(() => {
  const files = [null, null];
  const objectUrls = [null, null];
  const durations = [0, 0];
  let outputDuration = 10;
  let ffmpeg = null;
  let engineLoaded = false;
  let outputUrl = null;
  const $ = id => document.getElementById(id);
  const fmt = sec => {
    sec = Math.max(0, Number(sec) || 0);
    const m = Math.floor(sec / 60);
    const s = (sec % 60).toFixed(1).padStart(4, '0');
    return `${String(m).padStart(2,'0')}:${s}`;
  };

  function updateStartLimit(i) {
    const slider = $(`start${i}`);
    const max = Math.max(0, durations[i] - outputDuration);
    slider.max = max.toFixed(1);
    if (+slider.value > max) slider.value = max.toFixed(1);
    $(`time${i}`).textContent = fmt(slider.value);
  }

  function loadFile(i, file) {
    if (!file) return;
    files[i] = file;
    if (objectUrls[i]) URL.revokeObjectURL(objectUrls[i]);
    objectUrls[i] = URL.createObjectURL(file);
    const video = $(`video${i}`);
    video.src = objectUrls[i];
    video.style.display = 'block';
    $(`empty${i}`).style.display = 'none';
    $(`slot${i}`).classList.add('has-video');
    video.onloadedmetadata = () => {
      durations[i] = Number.isFinite(video.duration) ? video.duration : 0;
      $(`start${i}`).disabled = false;
      updateStartLimit(i);
      if (durations[i] < outputDuration) alert(`第 ${i+1} 支影片只有 ${durations[i].toFixed(1)} 秒，短於目前成品長度。請改選較短長度或更換影片。`);
    };
  }

  function removeFile(i) {
    files[i] = null; durations[i] = 0;
    if (objectUrls[i]) URL.revokeObjectURL(objectUrls[i]);
    objectUrls[i] = null;
    const video = $(`video${i}`);
    video.pause(); video.removeAttribute('src'); video.load(); video.style.display='none';
    $(`empty${i}`).style.display='flex'; $(`slot${i}`).classList.remove('has-video');
    const input = $(`file${i}`); input.value='';
    const slider=$(`start${i}`); slider.disabled=true; slider.value=0; slider.max=0;
    $(`time${i}`).textContent='00:00.0';
  }

  [0,1].forEach(i => {
    $(`file${i}`).addEventListener('change', e => loadFile(i, e.target.files[0]));
    $(`start${i}`).addEventListener('input', e => {
      $(`time${i}`).textContent = fmt(e.target.value);
      const v=$(`video${i}`); if (files[i]) v.currentTime=+e.target.value;
    });
    $(`vol${i}`).addEventListener('input', e => $(`volText${i}`).textContent=`${Math.round(e.target.value*100)}%`);
  });
  document.querySelectorAll('[data-change]').forEach(b=>b.addEventListener('click',()=> $(`file${b.dataset.change}`).click()));
  document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>removeFile(+b.dataset.remove)));
  document.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active'); outputDuration=+btn.dataset.duration;
    updateStartLimit(0); updateStartLimit(1);
  }));

  $('previewBtn').addEventListener('click', async () => {
    if (!files[0] || !files[1]) return alert('請先加入兩支影片。');
    const vids=[$('video0'),$('video1')];
    vids.forEach((v,i)=>{v.currentTime=+$(`start${i}`).value; v.muted=true;});
    try { await Promise.all(vids.map(v=>v.play())); } catch(e) {}
    setTimeout(()=>vids.forEach(v=>v.pause()), outputDuration*1000);
  });

  async function loadEngine() {
    if (engineLoaded) return;
    $('status').textContent='第一次使用，正在下載影片處理引擎…';
    $('detail').textContent='約 30 MB，請保持網路連線。';
    const { FFmpeg } = FFmpegWASM;
    const { toBlobURL } = FFmpegUtil;
    ffmpeg = new FFmpeg();
    ffmpeg.on('log', ({message}) => { if (message) $('detail').textContent=message.slice(-180); });
    ffmpeg.on('progress', ({progress}) => { $('bar').style.width=`${Math.max(0,Math.min(100,progress*100)).toFixed(0)}%`; });
    const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';
    await ffmpeg.load({
      coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
      wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm')
    });
    engineLoaded=true;
  }

  $('exportBtn').addEventListener('click', async () => {
    if (!files[0] || !files[1]) return alert('請先加入兩支影片。');
    if (durations.some(d=>d < outputDuration)) return alert('其中一支影片短於成品長度，請選擇較短的成品長度或更換影片。');
    const btn=$('exportBtn'); btn.disabled=true; $('previewBtn').disabled=true;
    $('progressWrap').style.display='block'; $('result').style.display='none'; $('bar').style.width='0%';
    try {
      await loadEngine();
      const { fetchFile } = FFmpegUtil;
      $('status').textContent='正在讀取兩支影片…';
      const ext0=(files[0].name.split('.').pop()||'mp4').toLowerCase();
      const ext1=(files[1].name.split('.').pop()||'mp4').toLowerCase();
      const in0=`input0.${ext0}`, in1=`input1.${ext1}`;
      await ffmpeg.writeFile(in0, await fetchFile(files[0]));
      await ffmpeg.writeFile(in1, await fetchFile(files[1]));
      const s0=(+$('start0').value).toFixed(3), s1=(+$('start1').value).toFixed(3);
      const v0=$('mute0').checked?0:+$('vol0').value;
      const v1=$('mute1').checked?0:+$('vol1').value;
      const d=outputDuration.toFixed(3);
      const filter=[
        `[0:v]trim=start=${s0}:duration=${d},setpts=PTS-STARTPTS,scale=540:480:force_original_aspect_ratio=increase,crop=540:480,fps=24[v0]`,
        `[1:v]trim=start=${s1}:duration=${d},setpts=PTS-STARTPTS,scale=540:480:force_original_aspect_ratio=increase,crop=540:480,fps=24[v1]`,
        `[v0][v1]vstack=inputs=2[v]`,
        `[0:a]atrim=start=${s0}:duration=${d},asetpts=PTS-STARTPTS,volume=${v0}[a0]`,
        `[1:a]atrim=start=${s1}:duration=${d},asetpts=PTS-STARTPTS,volume=${v1}[a1]`,
        `[a0][a1]amix=inputs=2:duration=longest:dropout_transition=0:normalize=0,alimiter=limit=0.95[a]`
      ].join(';');
      $('status').textContent='正在合成兩格畫面與兩邊聲音…';
      $('detail').textContent='手機處理可能需要 1～5 分鐘，請不要離開此頁。';
      await ffmpeg.exec(['-i',in0,'-i',in1,'-filter_complex',filter,'-map','[v]','-map','[a]','-t',d,'-c:v','libx264','-preset','ultrafast','-crf','28','-pix_fmt','yuv420p','-c:a','aac','-b:a','128k','-movflags','+faststart','output.mp4']);
      const data=await ffmpeg.readFile('output.mp4');
      if (outputUrl) URL.revokeObjectURL(outputUrl);
      outputUrl=URL.createObjectURL(new Blob([data.buffer],{type:'video/mp4'}));
      $('resultVideo').src=outputUrl; $('download').href=outputUrl;
      $('result').style.display='block'; $('status').textContent='輸出完成'; $('detail').textContent='請先播放檢查兩格是否都會動、兩邊聲音是否都有。'; $('bar').style.width='100%';
      $('result').scrollIntoView({behavior:'smooth'});
      try{await ffmpeg.deleteFile(in0);await ffmpeg.deleteFile(in1);await ffmpeg.deleteFile('output.mp4');}catch(e){}
    } catch(err) {
      console.error(err);
      $('status').textContent='輸出失敗';
      $('detail').textContent=(err&&err.message?err.message:String(err))+'。若是 iPhone 原始 HEVC 影片，請先用較短、相容性較高的 MP4 測試。';
      alert('輸出失敗，請查看下方錯誤訊息。');
    } finally { btn.disabled=false; $('previewBtn').disabled=false; }
  });
})();
</script>
</body>
</html>
