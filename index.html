<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#f5f3ef" />
  <title>銅鑼燒工作室｜手機影片拼接</title>
  <style>
    :root{
      --bg:#e9e5de;
      --panel:#f7f5f1;
      --panel2:#ded9d1;
      --line:#c8c1b7;
      --text:#292d32;
      --muted:#686f76;
      --accent:#667684;
      --accent2:#4f6272;
      --danger:#a45f63;
      --shadow:0 9px 24px rgba(48,54,60,.12);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      margin:0;
      background:linear-gradient(180deg,#efede8 0%,#ddd8d0 100%);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
      min-height:100vh;
    }
    .app{width:min(100%,560px);margin:auto;padding:22px 14px 42px}
    h1{font-size:22px;margin:2px 0 5px;text-align:center;letter-spacing:.8px;font-weight:750}
    .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}
    .notice{
      background:rgba(247,245,241,.94);
      border:1px solid var(--line);
      border-radius:16px;
      padding:11px 13px;
      color:#5f666d;
      font-size:12px;
      line-height:1.65;
      margin-bottom:14px;
      box-shadow:var(--shadow);
    }
    .grid{display:grid;gap:12px}
    .slot{
      position:relative;
      height:220px;
      border:1.5px dashed #9da6ad;
      border-radius:20px;
      background:#f7f5f1;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:var(--shadow);
    }
    .slot video{width:100%;height:100%;object-fit:cover;display:none;background:#000;transform:scale(1);transform-origin:50% 50%;object-position:50% 50%}
    .empty{display:flex;flex-direction:column;gap:9px;align-items:center;color:#5f666d;font-size:14px;padding:20px;text-align:center}
    .plus{
      width:46px;height:46px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:28px;line-height:1;color:#425563;background:#d9e0e4;
    }
    .slot input{display:none}
    .slot-tools{position:absolute;right:9px;top:9px;display:none;gap:6px}
    .slot.has-video .slot-tools{display:flex}
    .mini{
      border:1px solid rgba(255,255,255,.62);
      background:rgba(242,240,236,.92);
      color:#38444d;
      border-radius:10px;
      padding:7px 10px;
      font-size:12px;
      backdrop-filter:blur(8px);
    }
    .slot-label{
      position:absolute;left:9px;top:9px;
      background:rgba(242,240,236,.92);
      padding:6px 9px;border-radius:10px;
      font-size:12px;color:#35424b;
      backdrop-filter:blur(8px);
    }
    .control{
      margin-top:10px;
      background:rgba(247,245,241,.96);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      box-shadow:var(--shadow);
    }
    .row{display:flex;align-items:center;gap:9px;margin:9px 0}
    .row label{width:76px;color:#4d555c;font-size:13px;flex:none}
    input[type=range]{width:100%;accent-color:var(--accent2)}
    .time{width:66px;text-align:right;font-variant-numeric:tabular-nums;color:#3f4a52;font-size:13px}
    .duration{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:7px}
    .custom-duration{display:none;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;background:#e8e3dc;border-radius:12px}
    .custom-duration.show{display:flex}
    .custom-duration input{width:82px;border:1px solid #bcb5ac;border-radius:10px;padding:9px 10px;font-size:16px;background:#fff;color:#30383e}
    .hint{font-size:12px;color:var(--muted);line-height:1.5}
    .adjust-title{font-size:12px;color:#60686e;margin:2px 0 4px}
    .choice,.btn{
      border:1px solid #bcb5ac;
      background:#e6e1da;
      color:#364149;
      border-radius:13px;
      padding:11px;
      font-size:14px;
      font-weight:650;
    }
    .choice.active{background:#cbd4da;border-color:#7f919e;color:#263944}
    .actions{display:grid;grid-template-columns:1fr 1.45fr;gap:9px;margin-top:13px}
    .btn.primary{background:#566c7b;border-color:#566c7b;color:#fff}
    .btn:disabled{opacity:.45}
    .progress-wrap,.result{
      display:none;margin-top:13px;
      background:rgba(247,245,241,.97);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      box-shadow:var(--shadow);
    }
    .progress{height:10px;background:#d7d1c9;border-radius:99px;overflow:hidden;margin:9px 0}
    .bar{height:100%;width:0;background:#617686;transition:width .2s}
    .status{font-size:13px;color:#46515a;line-height:1.5;word-break:break-word}
    .result video{width:100%;max-height:70vh;background:#000;border-radius:14px}
    .download{display:block;text-align:center;text-decoration:none;margin-top:10px}
    .switch{margin-left:auto;display:flex;align-items:center;gap:6px;color:#5f666d;font-size:12px}
    .switch input{width:18px;height:18px;accent-color:var(--accent2)}
    .foot{color:#6f767b;font-size:11px;text-align:center;margin-top:17px;line-height:1.6}
    button{cursor:pointer}
    button:active{transform:scale(.985)}
  </style>
</head>
<body>
<div class="app">
  <h1>手機影片拼接</h1>
  <div class="sub">上下雙格・可調整畫面・480 × 856</div>
  <div class="notice">加入兩支影片後，可分別調整左右、上下與縮放。兩支影片的原聲會固定保留並混合；輸出時請保持 Safari 畫面開啟。</div>

  <div class="grid">
    <div class="slot" id="slot0">
      <div class="slot-label">第 1 格</div>
      <video id="video0" playsinline muted></video>
      <label class="empty" id="empty0" for="file0"><span class="plus">＋</span><span>點此加入第 1 支影片</span></label>
      <input id="file0" type="file" accept="video/*" />
      <div class="slot-tools"><button class="mini" data-change="0">更換</button><button class="mini" data-remove="0">移除</button></div>
    </div>
    <div class="control" id="control0">
      <div class="row"><label>截取起點</label><input id="start0" type="range" min="0" max="0" step="0.1" value="0" disabled><span class="time" id="time0">00:00.0</span></div>
      <div class="adjust-title">畫面位置</div>
      <div class="row"><label>左右</label><input id="posX0" type="range" min="0" max="100" step="1" value="50"><span class="time" id="posXText0">中間</span></div>
      <div class="row"><label>上下</label><input id="posY0" type="range" min="0" max="100" step="1" value="50"><span class="time" id="posYText0">中間</span></div>
      <div class="row"><label>縮放</label><input id="zoom0" type="range" min="1" max="1.8" step="0.05" value="1"><span class="time" id="zoomText0">100%</span></div>
      <div class="hint">兩支影片的聲音會自動保留並混合。</div>
    </div>

    <div class="slot" id="slot1">
      <div class="slot-label">第 2 格</div>
      <video id="video1" playsinline muted></video>
      <label class="empty" id="empty1" for="file1"><span class="plus">＋</span><span>點此加入第 2 支影片</span></label>
      <input id="file1" type="file" accept="video/*" />
      <div class="slot-tools"><button class="mini" data-change="1">更換</button><button class="mini" data-remove="1">移除</button></div>
    </div>
    <div class="control" id="control1">
      <div class="row"><label>截取起點</label><input id="start1" type="range" min="0" max="0" step="0.1" value="0" disabled><span class="time" id="time1">00:00.0</span></div>
      <div class="adjust-title">畫面位置</div>
      <div class="row"><label>左右</label><input id="posX1" type="range" min="0" max="100" step="1" value="50"><span class="time" id="posXText1">中間</span></div>
      <div class="row"><label>上下</label><input id="posY1" type="range" min="0" max="100" step="1" value="50"><span class="time" id="posYText1">中間</span></div>
      <div class="row"><label>縮放</label><input id="zoom1" type="range" min="1" max="1.8" step="0.05" value="1"><span class="time" id="zoomText1">100%</span></div>
      <div class="hint">兩支影片的聲音會自動保留並混合。</div>
    </div>
  </div>

  <div class="control">
    <div style="font-size:13px;color:#4d555c;margin-bottom:6px">成品長度</div>
    <div class="duration">
      <button class="choice active" data-duration="5">5 秒</button>
      <button class="choice" data-duration="10">10 秒</button>
      <button class="choice" data-duration="custom">自訂</button>
    </div>
    <div class="custom-duration" id="customDurationWrap">
      <label for="customDuration">秒數</label>
      <input id="customDuration" type="number" min="1" max="15" step="1" value="8" inputmode="numeric">
      <span class="hint">限 1～15 秒</span>
    </div>
    <div class="actions">
      <button class="btn" id="previewBtn">預覽片段</button>
      <button class="btn primary" id="exportBtn">產生拼接影片</button>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="status" id="status">準備中…</div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="status" id="detail"></div>
  </div>

  <div class="result" id="result">
    <div style="font-size:14px;margin-bottom:8px">輸出完成</div>
    <video id="resultVideo" controls playsinline></video>
    <a class="btn primary download" id="download" download="手機影片拼接.mp4">下載／儲存影片</a>
  </div>
  <div class="foot">影片只在你的手機內處理，不會上傳到伺服器。<br>兩支影片會在手機內完成拼接與混音。</div>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script>
(() => {
  const files = [null, null];
  const objectUrls = [null, null];
  const durations = [0, 0];
  let outputDuration = 5;
  let ffmpeg = null;
  let engineLoaded = false;
  let enginePromise = null;
  let outputUrl = null;
  let previewTimer = null;
  let exportInProgress = false;
  const $ = id => document.getElementById(id);
  const fmt = sec => {
    sec = Math.max(0, Number(sec) || 0);
    const m = Math.floor(sec / 60);
    const s = (sec % 60).toFixed(1).padStart(4, '0');
    return `${String(m).padStart(2,'0')}:${s}`;
  };

  function updateStartLimit(i) {
    const slider = $(`start${i}`);
    const max = Math.max(0, durations[i] - outputDuration);
    slider.max = max.toFixed(1);
    if (+slider.value > max) slider.value = max.toFixed(1);
    $(`time${i}`).textContent = fmt(slider.value);
  }

  function loadFile(i, file) {
    if (!file) return;
    if (exportInProgress) return alert('影片正在輸出，完成前請不要更換檔案。');
    const maxBytes = 700 * 1024 * 1024;
    if (file.size > maxBytes) return alert('單支影片超過 700 MB，iPhone 容易因記憶體不足而失敗。請先縮短影片再試。');
    files[i] = file;
    if (objectUrls[i]) URL.revokeObjectURL(objectUrls[i]);
    objectUrls[i] = URL.createObjectURL(file);
    const video = $(`video${i}`);
    video.src = objectUrls[i];
    video.style.display = 'block';
    $(`empty${i}`).style.display = 'none';
    $(`slot${i}`).classList.add('has-video');
    video.onerror = () => {
      removeFile(i);
      alert(`第 ${i+1} 支影片無法讀取，請改用 iPhone 相簿中可正常播放的影片。`);
    };
    video.onloadedmetadata = () => {
      durations[i] = Number.isFinite(video.duration) ? video.duration : 0;
      $(`start${i}`).disabled = false;
      updateStartLimit(i);
      if (durations[i] < outputDuration) alert(`第 ${i+1} 支影片只有 ${durations[i].toFixed(1)} 秒，短於目前成品長度。請改選較短長度或更換影片。`);
    };
  }

  function removeFile(i) {
    if (exportInProgress) return;
    files[i] = null; durations[i] = 0;
    if (objectUrls[i]) URL.revokeObjectURL(objectUrls[i]);
    objectUrls[i] = null;
    const video = $(`video${i}`);
    video.pause(); video.removeAttribute('src'); video.load(); video.style.display='none';
    $(`empty${i}`).style.display='flex'; $(`slot${i}`).classList.remove('has-video');
    const input = $(`file${i}`); input.value='';
    const slider=$(`start${i}`); slider.disabled=true; slider.value=0; slider.max=0;
    $(`time${i}`).textContent='00:00.0';
  }

  function positionText(value, low, high) {
    const n=+value;
    if (n < 35) return low;
    if (n > 65) return high;
    return '中間';
  }

  function updateFramePreview(i) {
    const x=+$(`posX${i}`).value;
    const y=+$(`posY${i}`).value;
    const z=+$(`zoom${i}`).value;
    const v=$(`video${i}`);
    v.style.objectPosition=`${x}% ${y}%`;
    v.style.transformOrigin=`${x}% ${y}%`;
    v.style.transform=`scale(${z})`;
    $(`posXText${i}`).textContent=positionText(x,'偏左','偏右');
    $(`posYText${i}`).textContent=positionText(y,'偏上','偏下');
    $(`zoomText${i}`).textContent=`${Math.round(z*100)}%`;
  }

  [0,1].forEach(i => {
    $(`file${i}`).addEventListener('change', e => loadFile(i, e.target.files[0]));
    $(`start${i}`).addEventListener('input', e => {
      $(`time${i}`).textContent = fmt(e.target.value);
      const v=$(`video${i}`); if (files[i]) v.currentTime=+e.target.value;
    });
    ['posX','posY','zoom'].forEach(kind => {
      $(`${kind}${i}`).addEventListener('input', updateFramePreview.bind(null,i));
    });
  });
  document.querySelectorAll('[data-change]').forEach(b=>b.addEventListener('click',()=>{ const input=$(`file${b.dataset.change}`); input.value=''; input.click(); }));
  document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>removeFile(+b.dataset.remove)));
  function applyDuration(value) {
    const n=Math.max(1,Math.min(15,Math.round(Number(value)||5)));
    outputDuration=n;
    $('customDuration').value=n;
    updateStartLimit(0); updateStartLimit(1);
  }

  document.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    const custom=btn.dataset.duration==='custom';
    $('customDurationWrap').classList.toggle('show',custom);
    applyDuration(custom ? $('customDuration').value : btn.dataset.duration);
  }));
  $('customDuration').addEventListener('input',e=>applyDuration(e.target.value));
  $('customDuration').addEventListener('blur',e=>applyDuration(e.target.value));

  $('previewBtn').addEventListener('click', async () => {
    if (exportInProgress) return;
    if (!files[0] || !files[1]) return alert('請先加入兩支影片。');
    const vids=[$('video0'),$('video1')];
    if (previewTimer) clearTimeout(previewTimer);
    vids.forEach((v,i)=>{ v.pause(); v.currentTime=+$(`start${i}`).value; v.muted=true; });
    try { await Promise.all(vids.map(v=>v.play())); } catch(e) {}
    previewTimer=setTimeout(()=>{ vids.forEach(v=>v.pause()); previewTimer=null; }, outputDuration*1000);
  });

  async function loadEngine() {
    if (engineLoaded) return;
    if (enginePromise) return enginePromise;
    enginePromise=(async()=>{
      $('status').textContent='第一次使用，正在下載影片處理引擎…';
      $('detail').textContent='約 30 MB，請保持網路連線。';
      const { FFmpeg } = FFmpegWASM;
      const { toBlobURL } = FFmpegUtil;
      ffmpeg = new FFmpeg();
      ffmpeg.on('log', ({message}) => { if (message && exportInProgress) $('detail').textContent=message.slice(-160); });
      ffmpeg.on('progress', ({progress}) => { if (exportInProgress) $('bar').style.width=`${Math.max(0,Math.min(100,progress*100)).toFixed(0)}%`; });
      const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';
      await ffmpeg.load({
        coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
        wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm')
      });
      engineLoaded=true;
    })();
    try { await enginePromise; } catch(e) { enginePromise=null; ffmpeg=null; throw e; }
  }

  async function safeDelete(...names){
    if (!ffmpeg) return;
    for (const name of names) { try { await ffmpeg.deleteFile(name); } catch(e) {} }
  }

  $('exportBtn').addEventListener('click', async () => {
    if (exportInProgress) return;
    if (!files[0] || !files[1]) return alert('請先加入兩支影片。');
    if (durations.some(d=>d < outputDuration)) return alert('其中一支影片短於成品長度，請選擇較短的成品長度或更換影片。');
    exportInProgress=true;
    if (previewTimer) { clearTimeout(previewTimer); previewTimer=null; }
    [$('video0'),$('video1')].forEach(v=>v.pause());
    const btn=$('exportBtn'); btn.disabled=true; $('previewBtn').disabled=true;
    $('progressWrap').style.display='block'; $('result').style.display='none'; $('bar').style.width='0%';
    try {
      await loadEngine();
      const { fetchFile } = FFmpegUtil;
      $('status').textContent='正在讀取兩支影片…';
      const ext0=(files[0].name.split('.').pop()||'mp4').toLowerCase();
      const ext1=(files[1].name.split('.').pop()||'mp4').toLowerCase();
      const in0=`input0.${ext0}`, in1=`input1.${ext1}`;
      await ffmpeg.writeFile(in0, await fetchFile(files[0]));
      await ffmpeg.writeFile(in1, await fetchFile(files[1]));
      const s0=(+$('start0').value).toFixed(3), s1=(+$('start1').value).toFixed(3);
      const x0=(+$('posX0').value/100).toFixed(3), y0=(+$('posY0').value/100).toFixed(3), z0=(+$('zoom0').value).toFixed(2);
      const x1=(+$('posX1').value/100).toFixed(3), y1=(+$('posY1').value/100).toFixed(3), z1=(+$('zoom1').value).toFixed(2);
      const d=outputDuration.toFixed(3);
      const filter=[
        `[0:v]trim=start=${s0}:duration=${d},settb=AVTB,setpts=PTS-STARTPTS,scale=w='if(gt(a,480/428),-2,480*${z0})':h='if(gt(a,480/428),428*${z0},-2)',crop=480:428:x='(in_w-out_w)*${x0}':y='(in_h-out_h)*${y0}',setsar=1,fps=24[v0]`,
        `[1:v]trim=start=${s1}:duration=${d},settb=AVTB,setpts=PTS-STARTPTS,scale=w='if(gt(a,480/428),-2,480*${z1})':h='if(gt(a,480/428),428*${z1},-2)',crop=480:428:x='(in_w-out_w)*${x1}':y='(in_h-out_h)*${y1}',setsar=1,fps=24[v1]`,
        `[v0][v1]vstack=inputs=2[v]`,
        `[0:a]atrim=start=${s0}:duration=${d},asetpts=PTS-STARTPTS,volume=1[a0]`,
        `[1:a]atrim=start=${s1}:duration=${d},asetpts=PTS-STARTPTS,volume=1[a1]`,
        `[a0][a1]amix=inputs=2:duration=longest:dropout_transition=0:normalize=0,alimiter=limit=0.95[a]`
      ].join(';');
      $('status').textContent='正在合成兩格畫面與兩邊聲音…';
      $('detail').textContent='手機處理可能需要 1～5 分鐘，請不要離開此頁。';
      await ffmpeg.exec(['-threads','1','-i',in0,'-i',in1,'-filter_complex',filter,'-map','[v]','-map','[a]','-t',d,'-c:v','libx264','-preset','ultrafast','-crf','29','-pix_fmt','yuv420p','-c:a','aac','-b:a','128k','-ar','44100','-movflags','+faststart','output.mp4']);
      const data=await ffmpeg.readFile('output.mp4');
      if (outputUrl) URL.revokeObjectURL(outputUrl);
      outputUrl=URL.createObjectURL(new Blob([data.buffer],{type:'video/mp4'}));
      $('resultVideo').src=outputUrl; $('download').href=outputUrl;
      $('result').style.display='block'; $('status').textContent='輸出完成'; $('detail').textContent='請先播放檢查兩格畫面位置與兩邊聲音是否正常。'; $('bar').style.width='100%';
      $('result').scrollIntoView({behavior:'smooth'});
      await safeDelete(in0,in1,'output.mp4');
    } catch(err) {
      console.error(err);
      $('status').textContent='輸出失敗';
      $('detail').textContent=(err&&err.message?err.message:String(err))+'。若是 iPhone 原始 HEVC 影片，請先用較短、相容性較高的 MP4 測試。';
      alert('輸出失敗，請查看下方錯誤訊息。');
    } finally {
      exportInProgress=false;
      btn.disabled=false; $('previewBtn').disabled=false;
      try { await safeDelete('output.mp4'); } catch(e) {}
    }
  });
  updateFramePreview(0); updateFramePreview(1);

  document.addEventListener('visibilitychange',()=>{
    if (document.hidden && exportInProgress) {
      $('detail').textContent='畫面已切到背景，iPhone 可能暫停處理；請立刻回到此頁。';
    }
  });

  window.addEventListener('beforeunload',()=>{
    if (previewTimer) clearTimeout(previewTimer);
    objectUrls.forEach(u=>{ if(u) URL.revokeObjectURL(u); });
    if (outputUrl) URL.revokeObjectURL(outputUrl);
  });
})();
